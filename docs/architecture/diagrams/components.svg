<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1330" viewBox="0 0 1500 1330" role="img" aria-labelledby="title desc"><title id="title">Component — пять сервисов и инфраструктура</title><desc id="desc">Сплошные стрелки — API; шина Kafka — события. Хранилища доступны только внутренним ролям.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#446880"/></marker></defs><rect width="1500" height="1330" fill="white"/><g font-family="Arial, sans-serif"><text x="48" y="52" font-size="30" fill="#18344a">Component — пять сервисов и инфраструктура</text><text x="48" y="86" font-size="17" fill="#557186">Сплошные стрелки — API; шина Kafka — события. Хранилища доступны только внутренним ролям.</text><rect x="50" y="130" width="340" height="90" rx="12" fill="#e9f2fa" stroke="#8ba7bd"/><text x="68" y="159" font-size="20" fill="#18344a">Браузер / frontend</text><text x="68" y="187" font-size="16" fill="#18344a">Қажмұрат · недоверенная зона</text><rect x="1090" y="130" width="360" height="90" rx="12" fill="#e9f2fa" stroke="#8ba7bd"/><text x="1108" y="159" font-size="20" fill="#18344a">Внешние API</text><text x="1108" y="187" font-size="16" fill="#18344a">Steam / FACEIT / OpenDota / Premier</text><rect x="35" y="260" width="1430" height="1000" rx="16" fill="#f7fafc" stroke="#8ba7bd" stroke-dasharray="8 6"/><text x="53" y="288" font-size="17" fill="#18344a">Внутренняя зона Kubernetes · кластер / CI / наблюдаемость: Ерхан</text><rect x="70" y="315" width="340" height="85" rx="12" fill="#e9f2fa" stroke="#8ba7bd"/><text x="88" y="344" font-size="20" fill="#18344a">API Gateway</text><text x="88" y="372" font-size="16" fill="#18344a">HTTPS → REST · JWT · rate limit</text><rect x="70" y="465" width="350" height="140" rx="12" fill="#e9f2fa" stroke="#8ba7bd"/><text x="88" y="494" font-size="20" fill="#18344a">1. Users / Profiles</text><text x="88" y="522" font-size="16" fill="#18344a">Амир · Go</text><text x="88" y="545" font-size="16" fill="#18344a">Аккаунты, профиль, тариф</text><text x="88" y="568" font-size="16" fill="#18344a">PostgreSQL: users</text><rect x="575" y="465" width="350" height="140" rx="12" fill="#e9f2fa" stroke="#8ba7bd"/><text x="593" y="494" font-size="20" fill="#18344a">2. Matches / Uploads</text><text x="593" y="522" font-size="16" fill="#18344a">Амир · Go</text><text x="593" y="545" font-size="16" fill="#18344a">Карточки, jobs, quota, outbox</text><text x="593" y="568" font-size="16" fill="#18344a">PostgreSQL: matches</text><rect x="1080" y="465" width="350" height="140" rx="12" fill="#e9f2fa" stroke="#8ba7bd"/><text x="1098" y="494" font-size="20" fill="#18344a">4. Statistics</text><text x="1098" y="522" font-size="16" fill="#18344a">Амир · Go</text><text x="1098" y="545" font-size="16" fill="#18344a">Публичные агрегаты</text><text x="1098" y="568" font-size="16" fill="#18344a">PostgreSQL: statistics</text><rect x="70" y="800" width="350" height="140" rx="12" fill="#e9f2fa" stroke="#8ba7bd"/><text x="88" y="829" font-size="20" fill="#18344a">3. Data Processing</text><text x="88" y="857" font-size="16" fill="#18344a">Ерхан · parser workers</text><text x="88" y="880" font-size="16" fill="#18344a">Валидация, распаковка, события</text><text x="88" y="903" font-size="16" fill="#18344a">PostgreSQL: processing</text><rect x="1080" y="800" width="350" height="140" rx="12" fill="#e9f2fa" stroke="#8ba7bd"/><text x="1098" y="829" font-size="20" fill="#18344a">5. Mistake Analysis</text><text x="1098" y="857" font-size="16" fill="#18344a">Қажмұрат · Python</text><text x="1098" y="880" font-size="16" fill="#18344a">Baseline / ML / личный отчёт</text><text x="1098" y="903" font-size="16" fill="#18344a">PostgreSQL: analysis</text><rect x="575" y="800" width="350" height="140" rx="12" fill="#e9f2fa" stroke="#8ba7bd"/><text x="593" y="829" font-size="20" fill="#18344a">Kafka · Амир</text><text x="593" y="857" font-size="16" fill="#18344a">requested → parsed → completed</text><text x="593" y="880" font-size="16" fill="#18344a">Ошибки → Matches; inbox/outbox</text><text x="593" y="903" font-size="16" fill="#18344a">В сообщениях нет файлов</text><rect x="70" y="1070" width="350" height="110" rx="12" fill="#eef6ed" stroke="#8ba7bd"/><text x="88" y="1099" font-size="20" fill="#18344a">PostgreSQL</text><text x="88" y="1127" font-size="16" fill="#18344a">Отдельные схемы / роли</text><text x="88" y="1150" font-size="16" fill="#18344a">Нет межсервисных SQL-записей</text><rect x="575" y="1070" width="350" height="110" rx="12" fill="#eef6ed" stroke="#8ba7bd"/><text x="593" y="1099" font-size="20" fill="#18344a">S3-совместимое · Амир</text><text x="593" y="1127" font-size="16" fill="#18344a">Приватные raw / datasets</text><text x="593" y="1150" font-size="16" fill="#18344a">Обработка: read/write по роли</text><rect x="1080" y="1070" width="350" height="110" rx="12" fill="#eef6ed" stroke="#8ba7bd"/><text x="1098" y="1099" font-size="20" fill="#18344a">Redis</text><text x="1098" y="1127" font-size="16" fill="#18344a">Кэш и rate limit</text><text x="1098" y="1150" font-size="16" fill="#18344a">Не источник истины квоты</text><path d="M220,220 L220,315" fill="none" stroke="#446880" stroke-width="2" marker-end="url(#arrow)"/><text x="235" y="245" font-size="15" fill="#18344a">HTTPS</text><path d="M240,400 L240,465" fill="none" stroke="#446880" stroke-width="2" marker-end="url(#arrow)"/><path d="M410,355 L750,465" fill="none" stroke="#446880" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="397" font-size="15" fill="#18344a">REST</text><path d="M410,345 L1255,465" fill="none" stroke="#446880" stroke-width="2" marker-end="url(#arrow)"/><text x="950" y="395" font-size="15" fill="#18344a">REST</text><path d="M750,465 L1270,220" fill="none" stroke="#446880" stroke-width="2" marker-end="url(#arrow)"/><text x="970" y="315" font-size="15" fill="#18344a">HTTPS API</text><path d="M575,535 L420,535" fill="none" stroke="#446880" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="523" font-size="15" fill="#18344a">gRPC</text><path d="M750,605 L750,800" fill="none" stroke="#446880" stroke-width="2" marker-end="url(#arrow)"/><text x="765" y="710" font-size="15" fill="#18344a">pub / sub</text><path d="M750,800 L750,605" fill="none" stroke="#446880" stroke-width="2" marker-end="url(#arrow)"/><path d="M575,850 L420,850" fill="none" stroke="#446880" stroke-width="2" marker-end="url(#arrow)"/><text x="445" y="833" font-size="15" fill="#18344a">pub / sub</text><path d="M420,850 L575,850" fill="none" stroke="#446880" stroke-width="2" marker-end="url(#arrow)"/><path d="M925,850 L1080,850" fill="none" stroke="#446880" stroke-width="2" marker-end="url(#arrow)"/><text x="940" y="833" font-size="15" fill="#18344a">pub / sub</text><path d="M1080,850 L925,850" fill="none" stroke="#446880" stroke-width="2" marker-end="url(#arrow)"/><path d="M925,815 L1255,605" fill="none" stroke="#446880" stroke-width="2" marker-end="url(#arrow)"/><text x="1080" y="718" font-size="15" fill="#18344a">parsed</text><text x="75" y="975" font-size="17" fill="#18344a">Дополнительные API: Gateway → Analysis (личный отчёт); Users → Steam (вход и профиль).</text><text x="75" y="1005" font-size="17" fill="#18344a">S3: Matches пишет raw; Processing читает raw / пишет dataset; Analysis и Statistics читают dataset.</text><text x="75" y="1035" font-size="17" fill="#18344a">Каждый сервис пишет только свою схему PostgreSQL. Gateway / сервисы используют Redis по назначению.</text><text x="75" y="1220" font-size="17" fill="#18344a">API Gateway, frontend, Kafka, БД, Redis и S3 не считаются дополнительными бизнес-сервисами.</text><text x="48" y="1305" font-size="15" fill="#557186">GameAnalytics · SE-2431 · GA-5 · 22.10.2026 · Проект для ревью, не работающая реализация</text></g></svg>
