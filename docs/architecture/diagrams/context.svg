<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940" role="img" aria-labelledby="title desc"><title id="title">System Context — GameAnalytics</title><desc id="desc">Публичный просмотр и защищённый анализ; стрелка показывает инициатора взаимодействия.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#446880"/></marker></defs><rect width="1500" height="940" fill="white"/><g font-family="Arial, sans-serif"><text x="48" y="52" font-size="30" fill="#18344a">System Context — GameAnalytics</text><text x="48" y="86" font-size="17" fill="#557186">Публичный просмотр и защищённый анализ; стрелка показывает инициатора взаимодействия.</text><rect x="440" y="180" width="580" height="540" rx="16" fill="#f7fafc" stroke="#8ba7bd" stroke-dasharray="8 6"/><text x="458" y="208" font-size="17" fill="#18344a">Граница GameAnalytics</text><rect x="50" y="240" width="300" height="110" rx="12" fill="#e9f2fa" stroke="#8ba7bd"/><text x="68" y="269" font-size="20" fill="#18344a">Гость / зритель</text><text x="68" y="297" font-size="16" fill="#18344a">Поиск по SteamID</text><text x="68" y="320" font-size="16" fill="#18344a">Просмотр доступных данных</text><rect x="50" y="465" width="300" height="130" rx="12" fill="#e9f2fa" stroke="#8ba7bd"/><text x="68" y="494" font-size="20" fill="#18344a">Владелец аккаунта</text><text x="68" y="522" font-size="16" fill="#18344a">Вход через Steam</text><text x="68" y="545" font-size="16" fill="#18344a">Своя демка из карточки</text><text x="68" y="568" font-size="16" fill="#18344a">Личный отчёт</text><rect x="485" y="300" width="490" height="190" rx="12" fill="#e9f2fa" stroke="#8ba7bd"/><text x="503" y="329" font-size="20" fill="#18344a">GameAnalytics</text><text x="503" y="357" font-size="16" fill="#18344a">Публичные профили и карточки матчей</text><text x="503" y="380" font-size="16" fill="#18344a">Проверка собственной записи</text><text x="503" y="403" font-size="16" fill="#18344a">Статистика и объяснимые эпизоды</text><text x="503" y="426" font-size="16" fill="#18344a">Web UI + API + пять сервисов</text><rect x="1110" y="180" width="340" height="105" rx="12" fill="#e9f2fa" stroke="#8ba7bd"/><text x="1128" y="209" font-size="20" fill="#18344a">Steam</text><text x="1128" y="237" font-size="16" fill="#18344a">Подтверждение аккаунта</text><text x="1128" y="260" font-size="16" fill="#18344a">Данные публичного профиля</text><rect x="1110" y="340" width="340" height="105" rx="12" fill="#e9f2fa" stroke="#8ba7bd"/><text x="1128" y="369" font-size="20" fill="#18344a">FACEIT / OpenDota</text><text x="1128" y="397" font-size="16" fill="#18344a">История и статистика</text><text x="1128" y="420" font-size="16" fill="#18344a">Ключи только на сервере</text><rect x="1110" y="500" width="340" height="125" rx="12" fill="#e9f2fa" stroke="#8ba7bd"/><text x="1128" y="529" font-size="20" fill="#18344a">Premier / Steam GC</text><text x="1128" y="557" font-size="16" fill="#18344a">История: адаптер GA-58</text><text x="1128" y="580" font-size="16" fill="#18344a">В MVP обязателен</text><text x="1128" y="603" font-size="16" fill="#18344a">Интеграция ещё не проверена</text><path d="M350,290 L485,330" fill="none" stroke="#446880" stroke-width="2" marker-end="url(#arrow)"/><text x="365" y="280" font-size="15" fill="#18344a">HTTPS</text><path d="M350,520 L485,440" fill="none" stroke="#446880" stroke-width="2" marker-end="url(#arrow)"/><text x="365" y="505" font-size="15" fill="#18344a">HTTPS</text><path d="M975,330 L1110,240" fill="none" stroke="#446880" stroke-width="2" marker-end="url(#arrow)"/><path d="M975,390 L1110,390" fill="none" stroke="#446880" stroke-width="2" marker-end="url(#arrow)"/><path d="M975,450 L1110,550" fill="none" stroke="#446880" stroke-width="2" marker-end="url(#arrow)"/><text x="485" y="570" font-size="16" fill="#18344a">Внешние API: таймауты, валидация, ограничение частоты</text><text x="485" y="604" font-size="16" fill="#18344a">Файл и личный отчёт доступны только владельцу</text><text x="485" y="638" font-size="16" fill="#18344a">Автоскачивания демки и общего «Добавить матч» нет</text><text x="50" y="805" font-size="19" fill="#18344a">Граница доверия: браузер и внешние ответы недоверенные; сервер проверяет права и входные данные.</text><text x="50" y="845" font-size="19" fill="#18344a">Доступный публичный профиль не означает полную историю всех матчей произвольного игрока.</text><text x="48" y="915" font-size="15" fill="#557186">GameAnalytics · SE-2431 · GA-5 · 22.10.2026 · Проект для ревью, не работающая реализация</text></g></svg>
