<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040" role="img" aria-labelledby="title desc"><title id="title">Use Case — пользовательские сценарии</title><desc id="desc">Линия — участие актора; коды FR соответствуют требованиям GA-1.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#446880"/></marker></defs><rect width="1500" height="1040" fill="white"/><g font-family="Arial, sans-serif"><text x="48" y="52" font-size="30" fill="#18344a">Use Case — пользовательские сценарии</text><text x="48" y="86" font-size="17" fill="#557186">Линия — участие актора; коды FR соответствуют требованиям GA-1.</text><rect x="400" y="130" width="1000" height="740" rx="16" fill="#f7fafc" stroke="#8ba7bd" stroke-dasharray="8 6"/><text x="418" y="158" font-size="17" fill="#18344a">Система GameAnalytics</text><rect x="50" y="210" width="280" height="85" rx="12" fill="#e9f2fa" stroke="#8ba7bd"/><text x="68" y="239" font-size="20" fill="#18344a">Гость</text><text x="68" y="267" font-size="16" fill="#18344a">Без авторизации</text><rect x="50" y="525" width="280" height="110" rx="12" fill="#e9f2fa" stroke="#8ba7bd"/><text x="68" y="554" font-size="20" fill="#18344a">Владелец</text><text x="68" y="582" font-size="16" fill="#18344a">Подтверждённый Steam</text><text x="68" y="605" font-size="16" fill="#18344a">Может также смотреть профиль</text><ellipse cx="880" cy="230" rx="370" ry="60" fill="#e9f2fa" stroke="#8ba7bd"/><text x="880" y="222" text-anchor="middle" font-size="17" fill="#18344a">Найти профиль и посмотреть доступную статистику</text><text x="880" y="246" text-anchor="middle" font-size="17" fill="#18344a">FR-01, FR-02, FR-09</text><ellipse cx="880" cy="365" rx="370" ry="60" fill="#e9f2fa" stroke="#8ba7bd"/><text x="880" y="357" text-anchor="middle" font-size="17" fill="#18344a">Открыть существующую карточку матча</text><text x="880" y="381" text-anchor="middle" font-size="17" fill="#18344a">FR-03</text><ellipse cx="880" cy="500" rx="370" ry="60" fill="#e9f2fa" stroke="#8ba7bd"/><text x="880" y="492" text-anchor="middle" font-size="17" fill="#18344a">Подтвердить Steam и загрузить свою демку</text><text x="880" y="516" text-anchor="middle" font-size="17" fill="#18344a">FR-04, FR-05, FR-06</text><ellipse cx="880" cy="635" rx="370" ry="60" fill="#e9f2fa" stroke="#8ba7bd"/><text x="880" y="627" text-anchor="middle" font-size="17" fill="#18344a">Запустить анализ, узнать статус и остаток квоты</text><text x="880" y="651" text-anchor="middle" font-size="17" fill="#18344a">FR-07, FR-08, FR-11</text><ellipse cx="880" cy="770" rx="370" ry="60" fill="#e9f2fa" stroke="#8ba7bd"/><text x="880" y="762" text-anchor="middle" font-size="17" fill="#18344a">Открыть личный отчёт / доступный исходник</text><text x="880" y="786" text-anchor="middle" font-size="17" fill="#18344a">FR-10, FR-12, FR-13</text><path d="M330,250 L510,230" stroke="#446880" stroke-width="2" fill="none"/><path d="M330,270 L510,365" stroke="#446880" stroke-width="2" fill="none"/><path d="M330,545 L510,500" stroke="#446880" stroke-width="2" fill="none"/><path d="M330,580 L510,635" stroke="#446880" stroke-width="2" fill="none"/><path d="M330,615 L510,770" stroke="#446880" stroke-width="2" fill="none"/><text x="50" y="925" font-size="18" fill="#18344a">Условия загрузки: существующая карточка, владелец в составе, поддерживаемый файл, свободный активный слот.</text><text x="50" y="960" font-size="18" fill="#18344a">Ошибки проверки не расходуют квоту. Неподтверждённое соответствие матчу останавливает анализ.</text><text x="48" y="1015" font-size="15" fill="#557186">GameAnalytics · SE-2431 · GA-5 · 22.10.2026 · Проект для ревью, не работающая реализация</text></g></svg>
